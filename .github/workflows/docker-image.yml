name: CI do Dashboard Docker

# 1. Quando é que isto vai rodar?
on:
  push:
    branches: [ "main" ]

# 2. O que é que ele vai fazer?
jobs:
  build:
    runs-on: ubuntu-latest 

    steps:
    # Passo A: O servidor "descarrega" o nosso código
    - name: Copiar os ficheiros do repositório
      uses: actions/checkout@v4

    # Passo B: Entra na pasta tarefa5 e constrói a imagem
    - name: Construir a Imagem Docker do NGINX
      working-directory: ./tarefa5
      run: docker build . --file Dockerfile --tag dashboard-nginx:latest
